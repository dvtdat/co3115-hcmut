name: Release Application

on:
  workflow_call:
    inputs:
      environment-name:
        description: "Target environment (dev, staging, prod)"
        required: true
        type: string

jobs:
  release:
    name: Deploy to S3 + Invalidate CloudFront
    environment:
      name: ${{ inputs.environment-name }}
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Read bucket name from tfvars
        id: tfvars
        run: |
          BUCKET=$(grep 'bucket_name' infra/live/${{ inputs.environment-name }}.tfvars | grep -oP '"[^"]+"' | tr -d '"')
          echo "bucket_name=$BUCKET" >> $GITHUB_OUTPUT

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ inputs.environment-name }}
          path: dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      # Upload hashed assets FIRST (no --delete) so existing users with a cached
      # index.html can still load old asset hashes during the deploy window.
      - name: Sync hashed assets (long cache)
        run: |
          aws s3 sync dist/assets/ s3://${{ steps.tfvars.outputs.bucket_name }}/assets/ \
            --cache-control "public, max-age=31536000, immutable"

      # Upload index.html and root files LAST with --delete.
      # After this step new users get the new index.html pointing at new asset hashes.
      - name: Sync root files (no cache)
        run: |
          aws s3 sync dist/ s3://${{ steps.tfvars.outputs.bucket_name }}/ \
            --delete \
            --exclude "assets/**" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
